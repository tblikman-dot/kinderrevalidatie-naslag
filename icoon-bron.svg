<!-- Bronbestand van het app-icoon: de letters KR, wit op het blauw van de app.
     Zelfde familie als de Emla-app (blauw vlak, wit beeld). De PNG's worden
     hieruit gemaakt met tests/maak-icoon.py; teken niet in de PNG's.
     De groep met id="art" wordt voor de maskeerbare Android-versie verkleind. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="achter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3B8AE8"/>
      <stop offset="1" stop-color="#0A57BC"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#achter)"/>
  <g id="art">
    <text x="256" y="338" text-anchor="middle" fill="#ffffff"
          font-family="-apple-system, 'Segoe UI', system-ui, Roboto, 'Helvetica Neue', Arial, sans-serif"
          font-size="236" font-weight="700" letter-spacing="-12">KR</text>
  </g>
</svg>
